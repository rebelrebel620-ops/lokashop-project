name: lokashop_qr_scanner
description: "Scan a LokaShop shipping-label QR code and view the order details. No login required."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^5.0.0
  webview_flutter: ^4.4.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/scanner_icon.png"