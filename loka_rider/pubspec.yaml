name: lokashop_rider
description: "LokaShop rider app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^5.0.0
  http: ^1.2.0
  shared_preferences: ^2.2.0
  cupertino_icons: ^1.0.6
  flutter_secure_storage: 9.2.4
  image_picker: 1.2.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.1
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/rider_logo.png
    - assets/places.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/rider_logo.png

